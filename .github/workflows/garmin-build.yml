name: Garmin Build

on:
  push:
    paths:
      - 'garmin/**'
      - '.github/workflows/garmin-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Connect IQ SDK manager CLI
        run: |
          set -x
          mkdir -p "$HOME/ciq-bin"
          curl -fsSL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh -s -- -b "$HOME/ciq-bin"
          ls -la "$HOME/ciq-bin"
          echo "$HOME/ciq-bin" >> "$GITHUB_PATH"
          # dump help so failures in later steps are debuggable from the log
          "$HOME/ciq-bin/connect-iq-sdk-manager" --help || true

      - name: Download SDK and device files
        run: |
          set -x
          MGR="$HOME/ciq-bin/connect-iq-sdk-manager"
          "$MGR" agreement accept
          "$MGR" sdk list || true
          "$MGR" sdk set '>=6.0.0'
          "$MGR" device download -m garmin/manifest.xml
          find "$HOME/.Garmin" -maxdepth 4 | head -50 || true

      - name: Inject Supabase credentials
        env:
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_EMAIL" ] || [ -z "$SUPABASE_PASSWORD" ]; then
            echo "::warning::SUPABASE_EMAIL / SUPABASE_PASSWORD secrets are not set — the app will show 'Keine Zugangsdaten im Build'."
          fi
          sed -i "s|__SUPABASE_EMAIL__|${SUPABASE_EMAIL}|" garmin/resources/properties.xml
          sed -i "s|__SUPABASE_PASSWORD__|${SUPABASE_PASSWORD}|" garmin/resources/properties.xml

      - name: Generate developer signing key
        run: |
          openssl genrsa -out dev_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in dev_key.pem -out dev_key.der -nocrypt

      - name: Build
        run: |
          set -x
          MGR="$HOME/ciq-bin/connect-iq-sdk-manager"
          SDK=$("$MGR" sdk current-path 2>/dev/null || true)
          if [ -z "$SDK" ]; then SDK=$(find "$HOME/.Garmin/ConnectIQ/Sdks" -mindepth 1 -maxdepth 1 -type d | head -1); fi
          echo "SDK at: $SDK"
          ls "$SDK/bin"
          mkdir -p out
          for dev in epix2 epix2pro42mm epix2pro47mm epix2pro51mm; do
            "$SDK/bin/monkeyc" -f garmin/monkey.jungle -o "out/Training-$dev.prg" -y dev_key.der -d "$dev" -w
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Training-Garmin
          path: out/*.prg

      - name: Sideload instructions
        run: |
          {
            echo "## Auf die Uhr bringen"
            echo "1. Artefakt **Training-Garmin** herunterladen und entpacken"
            echo "2. Epix 2 per USB an den Rechner anschließen"
            echo "3. \`Training-epix2.prg\` nach \`GARMIN/Apps/\` auf der Uhr kopieren (bei einer Epix 2 Pro die passende Pro-Variante)"
            echo "4. Uhr auswerfen und neu starten — die App erscheint in der Aktivitätenliste"
          } >> "$GITHUB_STEP_SUMMARY"
